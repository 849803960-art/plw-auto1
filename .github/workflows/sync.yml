name: 自动同步排列5开奖数据
on:
  schedule:
    - cron: '30 13 * * *'  # 北京时间21:30（UTC时间13:30）
    - cron: '0 4 * * *'     # 北京时间12:00，保持仓库活跃
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 使用系统Node.js
        run: |
          # 纯原生Node.js，不需要任何依赖
          cat > sync.js << 'EOF'
          const https = require('https');
          const fs = require('fs');

          // 纯原生HTTP请求，不需要axios
          function fetch(url) {
            return new Promise((resolve, reject) => {
              https.get(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                  'Accept-Language': 'zh-CN,zh;q=0.9'
                },
                timeout: 20000
              }, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
          }

          // 简单的HTML解析，不需要cheerio
          function extractLotteryData(html) {
            const results = [];
            
            // 查找所有表格行
            const rowRegex = /<tr[^>]*>([\s\S]*?)<\/tr>/gi;
            let match;
            
            while ((match = rowRegex.exec(html)) !== null) {
              const rowHtml = match[1];
              
              // 提取单元格内容
              const cellRegex = /<td[^>]*>([\s\S]*?)<\/td>/gi;
              const cells = [];
              let cellMatch;
              
              while ((cellMatch = cellRegex.exec(rowHtml)) !== null) {
                cells.push(cellMatch[1].trim().replace(/<[^>]+>/g, '').replace(/\s+/g, ''));
              }
              
              // 验证是否是有效的开奖数据
              if (cells.length >= 3 && /^\d{5}$/.test(cells[0]) && /^\d{5}$/.test(cells[2])) {
                results.push({
                  issue: cells[0],
                  date: cells[1],
                  code: cells[2]
                });
              }
            }
            
            return results;
          }

          async function main() {
            try {
              console.log('✅ 开始抓取体彩官网数据...');
              
              // 使用备用数据源，更稳定
              const html = await fetch('https://www.lottery.gov.cn/kj/kjlb.html?pl5');
              
              console.log('✅ 页面加载成功，开始解析数据...');
              const newData = extractLotteryData(html);
              
              if (newData.length === 0) {
                throw new Error('未解析到任何有效开奖数据');
              }
              
              console.log(`✅ 解析到${newData.length}条最新数据`);
              
              // 读取现有历史数据
              let history = [];
              if (fs.existsSync('history.json')) {
                try {
                  history = JSON.parse(fs.readFileSync('history.json', 'utf8'));
                  console.log(`✅ 读取到现有${history.length}期历史数据`);
                } catch (e) {
                  console.log('⚠️ 历史数据文件损坏，将创建新文件');
                  history = [];
                }
              } else {
                console.log('ℹ️ 没有找到历史数据文件，将创建新文件');
              }
              
              // 合并数据，去重
              const existingIssues = new Set(history.map(item => item.issue));
              let added = 0;
              
              for (const item of newData.slice(0, 20)) { // 只取最新20期
                if (!existingIssues.has(item.issue)) {
                  history.unshift(item);
                  added++;
                  console.log(`✅ 新增期号：${item.issue} | ${item.date} | ${item.code}`);
                }
              }
              
              // 按期号降序排序
              history.sort((a, b) => parseInt(b.issue) - parseInt(a.issue));
              
              // 保存数据
              fs.writeFileSync('history.json', JSON.stringify(history, null, 2));
              console.log(`\n🎉 同步完成！共${history.length}期数据，本次新增${added}期`);
              
            } catch (error) {
              console.error('\n❌ 同步失败:', error.message);
              process.exit(1);
            }
          }

          main();
          EOF
          
          # 直接运行，不需要安装任何依赖
          node sync.js

      - name: 配置Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 提交并推送更新
        run: |
          git add history.json
          git diff --quiet && echo "ℹ️ 没有数据变化，无需提交" && exit 0
          git commit -m "自动同步开奖数据 $(date +'%Y-%m-%d %H:%M:%S')"
          git push
